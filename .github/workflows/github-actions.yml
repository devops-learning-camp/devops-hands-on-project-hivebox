name: CI
run-name: ${{ github.actor }} — CI
on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint code
        run: pnpm lint

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

  build:
    name: Build Docker image and smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          tags: hivebox:${{ github.sha }}

      - name: Run container
        env:
          HOST: ${{ vars.HOST }}
          PORT: ${{ vars.PORT }}
          APP_VERSION: ${{ vars.APP_VERSION }}
          SENSE_BOX_IDS: ${{ vars.SENSE_BOX_IDS }}
        run: |
          docker run -d --rm -p 3000:3000 \
            -e HOST="$HOST" \
            -e PORT="$PORT" \
            -e APP_VERSION="$APP_VERSION" \
            -e SENSE_BOX_IDS="$SENSE_BOX_IDS" \
            --name hivebox-app hivebox:${{ github.sha }}

      - name: Smoke test /version
        run: curl --retry 10 --retry-delay 2 --retry-all-errors --fail http://localhost:3000/version

      - name: Cleanup
        if: always()
        run: docker rm -f hivebox-app || true
